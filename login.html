<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Login - KCP Organics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-image: url("bg_img.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            padding-top: 85px;
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 100px; /* just below navbar */
            left: 20px;
            padding: 10px 16px;
            background-color: #a8e063;
            color: #2e7d32;
            font-weight: 600;
            border: none;
            border-radius: 20px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
            z-index: 999;
            min-height: 44px;
            font-size: 14px;
        }

        .back-btn:hover {
            background-color: #56ab2f;
            color: white;
            transform: translateY(-2px);
        }

        /* Login Center */
        .login-wrapper {
            min-height: calc(100vh - 140px); /* space for navbar + back button */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px 35px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .login-container h1 {
            color: #2e7d32;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .login-container input {
            width: 100%;
            padding: 14px 15px;
            margin: 12px 0;
            border: 1px solid #c8e6c9;
            border-radius: 25px;
            font-size: 16px;
            background: #f1f8e9;
            min-height: 44px;
            box-sizing: border-box;
        }

        .login-container input:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        .login-container button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 25px;
            background-color: #2e7d32;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
        }

        .login-container button:hover {
            background-color: #1b5e20;
        }

        .signup-link {
            margin-top: 15px;
            font-size: 14px;
        }

        .signup-link a {
            color: #2e7d32;
            font-weight: 600;
            text-decoration: none;
        }

        #message {
            margin-bottom: 10px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            body {
                padding-top: 64px;
            }

            .back-btn {
                position: static;
                margin-bottom: 20px;
                margin-left: 0;
                padding: 8px 12px;
                font-size: 13px;
                width: fit-content;
            }

            .login-wrapper {
                min-height: auto;
                padding: 15px;
                flex-direction: column;
            }

            .login-container {
                padding: 30px 20px;
                border-radius: 20px;
            }

            .login-container h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            .login-container input {
                padding: 12px 15px;
                margin: 10px 0;
                font-size: 16px;
                min-height: 44px;
            }

            .login-container button {
                padding: 12px;
                font-size: 16px;
                min-height: 48px;
                margin-top: 12px;
            }

            .signup-link {
                font-size: 13px;
            }

            .section1,
            .section2 {
                gap: 20px;
            }
        }

        @media (max-width: 480px) {
            .back-btn {
                position: static;
                margin-bottom: 15px;
                margin-left: 0;
            }

            .login-wrapper {
                min-height: auto;
                padding: 10px;
                flex-direction: column;
            }

            .login-container {
                padding: 25px 15px;
                width: 100%;
            }

            .login-container h1 {
                font-size: 22px;
                margin-bottom: 15px;
            }

            .login-container input {
                padding: 12px 12px;
                margin: 8px 0;
                font-size: 16px;
            }

            .login-container button {
                padding: 12px;
                margin-top: 10px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <a href="home.html"><img src="logo_final.png" alt="logo"></a>
        </div>
        <div class="section1">
            <a href="home.html">Home</a>
            <a href="about-us.html">About us</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact us</a>
            <a href="admin-dashboard.html">Admin</a>
            <!-- <a href="track-order.html">Track Order</a> -->
        </div>
        <div class="section2" id="authSection">
            <a href="login.html" id="loginLink" class="active">Login</a>
            <a href="signup.html" id="signupLink">Sign up</a>
            <div class="user-dropdown" id="userDropdown" style="display: none;">
                <span id="userName" class="dropdown-toggle">Welcome, User</span>
                <div class="dropdown-menu">
                  <a href="track-order.html"><i class="fas fa-truck"></i> Track Status</a>
                  <a href="#" onclick="openMyOrders(event)"><i class="fas fa-history"></i> My Orders</a>
                  <a href="#" onclick="logoutUser(event)" class="logout-item"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
            <div class="navbar-cart" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                <span id="cartBadge">0</span>
            </div>
        </div>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span class="hamburger"></span>
        </button>
    </nav>

    <!-- Back Button -->
    <a href="home.html" class="back-btn">← Back to Home</a>

    <!-- Login Center -->
    <div class="login-wrapper">
        <div class="login-container">
            <h1>Welcome to KCP Organics</h1>
            <div id="message"></div>

            <form id="loginForm">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                email: form.email.value,
                password: form.password.value
            };

            try {
                const loginUrl = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:5000' : window.location.origin) + '/user/login';
                const response = await fetch(loginUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.innerText = data.message + ' Redirecting...';
                    messageDiv.style.color = 'green';
                    // Store user info and token
                    if (data.data) {
                        localStorage.setItem('userName', data.data.name);
                        localStorage.setItem('userEmail', data.data.email);
                        // server returns `id` field — use it if available, otherwise fallback to _id
                        localStorage.setItem('userId', data.data.id || data.data._id || 'guest');
                        localStorage.setItem('userRole', data.data.role);
                        // Migrate any guest cart items into this user's cart
                        try { if (typeof migrateGuestCartToUser === 'function') migrateGuestCartToUser(); } catch(e) {}
                    }
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                    }
                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 1000);
                } else {
                    messageDiv.innerText = data.message || 'Login failed';
                    messageDiv.style.color = 'red';
                }
            } catch (err) {
                messageDiv.innerText = 'Server error';
                messageDiv.style.color = 'red';
            }
        });
    </script>

    <script>
        function toggleCart() { window.location.href = 'cart.html'; }
        function logoutUser(event) {
            if (event) event.preventDefault();
            localStorage.removeItem('userName');
            localStorage.removeItem('userId');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userRole');
            localStorage.removeItem('token');
            sessionStorage.removeItem('token');
            window.location.reload();
        }
        function checkUserSession() {
            if (typeof updateAuthVisibility === 'function') {
                updateAuthVisibility();
            } else {
                const n = localStorage.getItem('userName');
                const u = localStorage.getItem('userId') || localStorage.getItem('token');
                if (n || u) {
                    if (document.getElementById('loginLink')) document.getElementById('loginLink').style.display = 'none';
                    if (document.getElementById('signupLink')) document.getElementById('signupLink').style.display = 'none';
                    if (document.getElementById('userDropdown')) document.getElementById('userDropdown').style.display = 'inline-block';
                    if (document.getElementById('userName')) document.getElementById('userName').textContent = 'Welcome, ' + (n || 'User');
                }
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            checkUserSession();
            var cart = JSON.parse(localStorage.getItem('cart') || '[]');
            document.getElementById('cartBadge').textContent = cart.reduce(function(s, i) { return s + (i.quantity || 0); }, 0);
        });
    </script>
    <script src="site.js"></script>
</body>
</html>
