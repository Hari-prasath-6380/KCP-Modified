<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Sign Up - KCP Organics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <a href="home.html"><img src="logo_final.png" alt="logo"></a>
        </div>
        <div class="section1">
            <a href="home.html">Home</a>
            <a href="about-us.html">About us</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact us</a>
            <a href="admin-dashboard.html">Admin</a>
        </div>
        <div class="section2" id="authSection">
            <a href="login.html" id="loginLink">Login</a>
            <a href="signup.html" id="signupLink" class="active">Sign up</a>
            <div class="user-dropdown" id="userDropdown" style="display: none;">
                <span id="userName" class="dropdown-toggle">Welcome, User</span>
                <div class="dropdown-menu">
                    <a href="track-order.html"><i class="fas fa-truck"></i> Track Status</a>
                    <a href="#" onclick="openMyOrders(event)"><i class="fas fa-history"></i> My Orders</a>
                    <a href="#" onclick="logoutUser(event)" class="logout-item"><i class="fas fa-sign-out-alt"></i>
                        Logout</a>
                </div>
            </div>
            <div class="navbar-cart" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                <span id="cartBadge">0</span>
            </div>
        </div>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span class="hamburger"></span>
        </button>
    </nav>

    <!-- Back Button -->
    <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>

    <!-- Signup Card -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
            <h1>Create Account</h1>
            <p class="subtitle">Join KCP Organics and start your organic journey</p>

            <div id="message"></div>

            <form id="signupForm">
                <div class="input-group">
                    <label for="signupName">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="signupName" name="name" class="has-icon" placeholder="Your full name"
                            required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="signupEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="signupEmail" name="email" class="has-icon" placeholder="you@example.com"
                            required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="signupPhone">Mobile Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="number" id="signupPhone" name="number" class="has-icon"
                            placeholder="+91 XXXXX XXXXX" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="signupPassword" name="password" class="has-icon"
                            placeholder="Create a strong password" required oninput="checkPasswordStrength(this)">
                        <button type="button" class="eye-toggle" onclick="togglePassword('signupPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <div class="bar" id="passwordBar"></div>
                    </div>
                </div>

                <div class="role-group">
                    <label class="group-label">Select Your Role</label>
                    <div class="role-options">
                        <div class="role-option">
                            <input type="radio" name="role" value="farmer" id="roleFarmer" required>
                            <label for="roleFarmer"><i class="fas fa-tractor"></i> Farmer</label>
                        </div>
                        <div class="role-option">
                            <input type="radio" name="role" value="citizen" id="roleCitizen">
                            <label for="roleCitizen"><i class="fas fa-house-user"></i> Citizen</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="auth-submit" id="signupBtn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="auth-footer-link">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword(inputId, btn) {
            var input = document.getElementById(inputId);
            var icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Password strength indicator
        function checkPasswordStrength(input) {
            var val = input.value;
            var bar = document.getElementById('passwordBar');
            var strength = 0;
            if (val.length >= 6) strength++;
            if (val.length >= 10) strength++;
            if (/[A-Z]/.test(val) && /[a-z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;

            var pct = (strength / 5) * 100;
            bar.style.width = pct + '%';
            if (strength <= 1) bar.style.background = '#e74c3c';
            else if (strength <= 2) bar.style.background = '#f39c12';
            else if (strength <= 3) bar.style.background = '#f1c40f';
            else bar.style.background = '#2e7d32';
        }

        // Signup form submission
        var form = document.getElementById('signupForm');
        var messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            var btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

            var formData = {
                name: form.name.value,
                email: form.email.value,
                number: form.number.value,
                password: form.password.value,
                role: form.role.value
            };

            try {
                var signupUrl = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:5000' : window.location.origin) + '/user/signup';
                var response = await fetch(signupUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                var data = await response.json();

                if (response.ok) {
                    messageDiv.innerHTML = '<div class="auth-message success"><i class="fas fa-check-circle"></i> ' + data.message + ' Redirecting...</div>';
                    if (data.data) {
                        localStorage.setItem('userName', data.data.name);
                        localStorage.setItem('userId', data.data.id || data.data._id || 'guest');
                        localStorage.setItem('userRole', data.data.role);
                        try { if (typeof migrateGuestCartToUser === 'function') migrateGuestCartToUser(); } catch (e) { }
                    }
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                    }
                    form.reset();
                    document.getElementById('passwordBar').style.width = '0%';
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1500);
                } else {
                    messageDiv.innerHTML = '<div class="auth-message error"><i class="fas fa-exclamation-circle"></i> ' + (data.message || 'Signup failed. Please try again.') + '</div>';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                }
            } catch (err) {
                messageDiv.innerHTML = '<div class="auth-message error"><i class="fas fa-exclamation-circle"></i> Server error. Please try again later.</div>';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        });
    </script>

    <script>
        function toggleCart() { window.location.href = 'cart.html'; }
        function logoutUser(event) {
            if (event) event.preventDefault();
            localStorage.removeItem('userName');
            localStorage.removeItem('userId');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userRole');
            localStorage.removeItem('token');
            sessionStorage.removeItem('token');
            window.location.reload();
        }
        function checkUserSession() {
            if (typeof updateAuthVisibility === 'function') {
                updateAuthVisibility();
            } else {
                var n = localStorage.getItem('userName');
                var u = localStorage.getItem('userId') || localStorage.getItem('token');
                if (n || u) {
                    if (document.getElementById('loginLink')) document.getElementById('loginLink').style.display = 'none';
                    if (document.getElementById('signupLink')) document.getElementById('signupLink').style.display = 'none';
                    if (document.getElementById('userDropdown')) document.getElementById('userDropdown').style.display = 'inline-block';
                    if (document.getElementById('userName')) document.getElementById('userName').textContent = 'Welcome, ' + (n || 'User');
                }
            }
        }
        document.addEventListener('DOMContentLoaded', function () {
            checkUserSession();
            var cart = JSON.parse(localStorage.getItem('cart') || '[]');
            document.getElementById('cartBadge').textContent = cart.reduce(function (s, i) { return s + (i.quantity || 0); }, 0);
        });
    </script>
    <script src="site.js"></script>
    <script src="navbar-enhancements.js"></script>
</body>

</html>
