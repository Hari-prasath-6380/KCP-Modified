<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Login - KCP Organics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <a href="home.html"><img src="logo_final.png" alt="logo"></a>
        </div>
        <div class="section1">
            <a href="home.html">Home</a>
            <a href="about-us.html">About us</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact us</a>
            <a href="admin-dashboard.html">Admin</a>
        </div>
        <div class="section2" id="authSection">
            <a href="login.html" id="loginLink" class="active">Login</a>
            <a href="signup.html" id="signupLink">Sign up</a>
            <div class="user-dropdown" id="userDropdown" style="display: none;">
                <span id="userName" class="dropdown-toggle">Welcome, User</span>
                <div class="dropdown-menu">
                    <a href="track-order.html"><i class="fas fa-truck"></i> Track Status</a>
                    <a href="#" onclick="openMyOrders(event)"><i class="fas fa-history"></i> My Orders</a>
                    <a href="#" onclick="logoutUser(event)" class="logout-item"><i class="fas fa-sign-out-alt"></i>
                        Logout</a>
                </div>
            </div>
            <div class="navbar-cart" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                <span id="cartBadge">0</span>
            </div>
        </div>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span class="hamburger"></span>
        </button>
    </nav>

    <!-- Back Button -->
    <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>

    <!-- Login Card -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-icon"><i class="fas fa-leaf"></i></div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to your KCP Organics account</p>

            <div id="message"></div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="loginEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="loginEmail" name="email" class="has-icon" placeholder="you@example.com"
                            required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="loginPassword" name="password" class="has-icon"
                            placeholder="Enter your password" required>
                        <button type="button" class="eye-toggle" onclick="togglePassword('loginPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth-submit" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="auth-footer-link">
                Don't have an account? <a href="signup.html">Create Account</a>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword(inputId, btn) {
            var input = document.getElementById(inputId);
            var icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Login form submission
        var form = document.getElementById('loginForm');
        var messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            var btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            var formData = {
                email: form.email.value,
                password: form.password.value
            };

            try {
                var loginUrl = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:5000' : window.location.origin) + '/user/login';
                var response = await fetch(loginUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                var data = await response.json();

                if (response.ok) {
                    messageDiv.innerHTML = '<div class="auth-message success"><i class="fas fa-check-circle"></i> ' + data.message + ' Redirecting...</div>';
                    if (data.data) {
                        localStorage.setItem('userName', data.data.name);
                        localStorage.setItem('userEmail', data.data.email);
                        localStorage.setItem('userId', data.data.id || data.data._id || 'guest');
                        localStorage.setItem('userRole', data.data.role);
                        try { if (typeof migrateGuestCartToUser === 'function') migrateGuestCartToUser(); } catch (e) { }
                    }
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                    }
                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 1200);
                } else {
                    messageDiv.innerHTML = '<div class="auth-message error"><i class="fas fa-exclamation-circle"></i> ' + (data.message || 'Login failed. Please check your credentials.') + '</div>';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                }
            } catch (err) {
                messageDiv.innerHTML = '<div class="auth-message error"><i class="fas fa-exclamation-circle"></i> Server error. Please try again later.</div>';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        });
    </script>

    <script>
        function toggleCart() { window.location.href = 'cart.html'; }
        function logoutUser(event) {
            if (event) event.preventDefault();
            localStorage.removeItem('userName');
            localStorage.removeItem('userId');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userRole');
            localStorage.removeItem('token');
            sessionStorage.removeItem('token');
            window.location.reload();
        }
        function checkUserSession() {
            if (typeof updateAuthVisibility === 'function') {
                updateAuthVisibility();
            } else {
                var n = localStorage.getItem('userName');
                var u = localStorage.getItem('userId') || localStorage.getItem('token');
                if (n || u) {
                    if (document.getElementById('loginLink')) document.getElementById('loginLink').style.display = 'none';
                    if (document.getElementById('signupLink')) document.getElementById('signupLink').style.display = 'none';
                    if (document.getElementById('userDropdown')) document.getElementById('userDropdown').style.display = 'inline-block';
                    if (document.getElementById('userName')) document.getElementById('userName').textContent = 'Welcome, ' + (n || 'User');
                }
            }
        }
        document.addEventListener('DOMContentLoaded', function () {
            checkUserSession();
            var cart = JSON.parse(localStorage.getItem('cart') || '[]');
            document.getElementById('cartBadge').textContent = cart.reduce(function (s, i) { return s + (i.quantity || 0); }, 0);
        });
    </script>
    <script src="site.js"></script>
    <script src="navbar-enhancements.js"></script>
</body>

</html>
